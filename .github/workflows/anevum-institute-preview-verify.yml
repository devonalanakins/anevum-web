name: ANEVUM Open Institute Preview Verify

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/anevum-institute-preview/**"
      - "scripts/ops/anevum-institute-preview-server.mjs"
      - "scripts/ops/verify-anevum-institute-preview-browser.mjs"
      - "tests/anevum-institute-preview.test.mjs"
      - "docs/design/ANEVUM.WEB.DESIGN.2026-11-17.001.OPEN-INSTITUTE-LEARNING-PREVIEW.md"
      - ".github/workflows/anevum-institute-preview-verify.yml"

permissions:
  contents: read

jobs:
  review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse self-contained preview files
        run: |
          node --check apps/anevum-institute-preview/worker.mjs
          node --check apps/anevum-institute-preview/styles.mjs
          node --check apps/anevum-institute-preview/client.mjs
          node --check apps/anevum-institute-preview/curriculum.mjs
          node --check apps/anevum-institute-preview/transistor-lesson.mjs
          node --check apps/anevum-institute-preview/study-tools.mjs
          node --check apps/anevum-institute-preview/frontier-society.mjs
          node --check scripts/ops/anevum-institute-preview-server.mjs
          node --check scripts/ops/verify-anevum-institute-preview-browser.mjs
      - name: Verify isolated educational content and route contracts
        run: node --test tests/anevum-institute-preview.test.mjs
      - name: Verify real Chromium interaction, accessibility and responsiveness
        run: node scripts/ops/verify-anevum-institute-preview-browser.mjs
      - name: Retain screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anevum-institute-design-review
          path: "${{ runner.temp }}/anevum-institute-*.png"
          if-no-files-found: warn
          retention-days: 7

# No production route, DNS, Worker, account, auth or deployment operations.
