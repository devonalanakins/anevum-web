name: ANEVUM public live release smoke (read-only)

on:
  push:
    branches: [verify/anevum-live-20261112]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anevum-live-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout verification source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public homepage, directory routes, images and protected boundaries
        env:
          ANEVUM_LIVE_BASE: https://anevum.com
        run: node scripts/ops/verify-anevum-live-public.mjs
